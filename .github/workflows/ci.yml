name: Contract test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Host contract test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.x", "24.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # The plugin declares the host packages as optional peers, so a plain
      # `npm install` pulls nothing at all. The contract test is worthless against
      # a stubbed defineTool, so install the published host packages explicitly.
      - name: Install the real host packages
        run: npm install --no-save --no-audit --no-fund @deepseek-ai/dsh-tools@0.2.1-rc.5 @deepseek-ai/cordis@^4.0.5

      - name: Resolve the host tools entry
        id: entry
        run: |
          # Not require.resolve(): dsh-tools' "exports" map exposes ".", "./types",
          # "./presentation" — "./lib/index.js" is a blocked subpath even though the
          # file is there. Point at the file directly instead of through the map.
          f=node_modules/@deepseek-ai/dsh-tools/lib/index.js
          test -f "$f" || { echo "::error::$f missing after install"; exit 1; }
          echo "entry=$(realpath "$f")" >> "$GITHUB_OUTPUT"

      - name: Run contract test against the host's real defineTool
        env:
          DSH_TOOLS_ENTRY: ${{ steps.entry.outputs.entry }}
        run: node test/contract_test.mjs

      - name: Structural check
        run: node --check lib/index.js
